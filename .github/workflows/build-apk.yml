name: Build FriendsHub APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore cached debug keystore
        id: keystore-cache
        uses: actions/cache/restore@v4
        with:
          path: debug.keystore
          key: friendshub-debug-keystore-v1

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "=== Copy this SHA1 into Firebase Console for Google Sign-In ==="
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1:|SHA256:" || true

      - name: Save debug keystore cache
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: debug.keystore
          key: friendshub-debug-keystore-v1

      - name: Prepare and validate Firebase google-services.json
        env:
          GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_VAR: ${{ vars.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f app/google-services.json ]; then
            RAW_JSON="${GOOGLE_SERVICES_SECRET:-$GOOGLE_SERVICES_VAR}"
            if [ -n "$RAW_JSON" ]; then
              printf '%s' "$RAW_JSON" > app/google-services.json
            fi
          fi
          if [ ! -f app/google-services.json ]; then
            echo "::error::Missing app/google-services.json. Add GOOGLE_SERVICES_JSON under GitHub Settings -> Secrets and variables -> Actions -> Secrets."
            exit 1
          fi
          python3 - <<'PY'
          import json, sys
          with open("app/google-services.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          clients = data.get("client", [])
          matching = [c for c in clients if c.get("client_info", {}).get("android_client_info", {}).get("package_name") == "com.aistudio.friendshub.vkmrqp"]
          if not matching:
              print("::error::google-services.json does not contain package com.aistudio.friendshub.vkmrqp", file=sys.stderr)
              sys.exit(1)
          oauth_clients = matching[0].get("oauth_client", [])
          has_web_client = any(o.get("client_type") == 3 for o in oauth_clients)
          if not has_web_client:
              print("::error::google-services.json is missing client_type 3 (default_web_client_id). Enable Google Sign-In in Firebase Auth and re-download google-services.json.", file=sys.stderr)
              sys.exit(1)
          print("Validated google-services.json for project:", data.get("project_info", {}).get("project_id"))
          PY

      - name: Accept Android SDK licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          mkdir -p "$SDK_DIR/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e" > "$SDK_DIR/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK_DIR/licenses/android-sdk-preview-license"
          if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --no-build-cache

      - name: Verify Google Sign-In config is baked into APK resources
        run: |
          VALUES_XML="app/build/generated/res/processDebugGoogleServices/values/values.xml"
          if [ ! -f "$VALUES_XML" ] || ! grep -q 'name="default_web_client_id"' "$VALUES_XML"; then
            echo "::error::default_web_client_id was not generated into APK resources!"
            exit 1
          fi
          echo "Verified default_web_client_id is present in compiled APK resources."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FriendsHub-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
